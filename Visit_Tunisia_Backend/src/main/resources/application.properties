# Secrets charges depuis .env (non versionne) - voir .env.example
spring.config.import=optional:file:.env[.properties]

spring.application.name=Visit_Tunisia
server.port=8082

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:visit_tunisia}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
# Secret key must be at least 256 bits (32 bytes) for HMAC-SHA256
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# Frontend Configuration for CORS & Password Reset Link
app.frontend.url=http://localhost:4200

# Spring Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
# Connection timeouts to fail fast instead of hanging registration
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Scraper Python Configuration
app.scraper.python-path=python
app.scraper.scripts-dir=./scraper
app.scraper.output-dir=./scraper/output
app.scraper.timeout-seconds=120

# File Upload Configuration
app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Weather API Configuration
weather.api.key=${WEATHER_API_KEY}
