name: CI - Build & Images (sans deploiement)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Par defaut : on construit mais on NE pousse PAS les images.
  # Passer cette variable a "true" (secret/var GitHub) active le push vers GHCR.
  PUSH_IMAGES: ${{ vars.PUSH_IMAGES || 'false' }}

jobs:
  # ============================================================
  # 1. BACKEND : tests + package jar
  # ============================================================
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: visit_tunisia
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d visit_tunisia"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: visit_tunisia
      DB_USER: postgres
      DB_PASSWORD: admin
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
    defaults:
      run:
        working-directory: Visit_Tunisia_Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Tester avec Maven
        run: mvn test
      - name: Empaqueter le jar
        if: github.event_name == 'push'
        run: mvn package -DskipTests
      - name: Uploader le jar (artefact)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: Visit_Tunisia_Backend/target/Visit_Tunisia-0.0.1-SNAPSHOT.jar

  # ============================================================
  # 2. FRONTEND : build Angular (production)
  # ============================================================
  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Visit_Tunisia_Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Visit_Tunisia_Frontend/package-lock.json
      - name: Installer les dependances
        run: npm ci
      - name: Build production
        run: npm run build

  # ============================================================
  # 3. AI : install python + verification import
  # ============================================================
  ai:
    name: AI (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Visit_Tunisia_AI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Visit_Tunisia_AI/requirements.txt
      - name: Installer les dependances
        run: pip install -r requirements.txt
      - name: Verifier que l'app importe (GEMINI_API_KEY factice)
        env:
          GEMINI_API_KEY: cle_factice_pour_test_ci
        run: python -c 'from main import app; print("AI import OK")'

  # ============================================================
  # 4. IMAGES DOCKER : construction + push Docker Hub (optionnel)
  # ============================================================
  docker-images:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend, ai]
    steps:
      - uses: actions/checkout@v4

      # Connexion Docker Hub uniquement si PUSH_IMAGES=true
      - name: Se connecter a Docker Hub
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Construire les 3 images avec les tags locaux (pas encore pousses)
      - name: Construire les images
        run: |
          SHA="${{ github.sha }}"
          docker build -t "vt-backend:smoke" Visit_Tunisia_Backend
          docker build -t "vt-frontend:smoke" Visit_Tunisia_Frontend
          docker build -t "vt-ai:smoke" Visit_Tunisia_AI

      # ============================================================
      # SMOKE TEST : lancer les 4 conteneurs et verifier les reponses
      # ============================================================
      - name: Smoke test — demarrer la BDD
        run: |
          docker network create vt-smoke
          docker run -d --network vt-smoke --name vt-db \
            -e POSTGRES_DB=visit_tunisia -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=admin \
            postgis/postgis:16-3.4
          for i in $(seq 1 30); do
            if docker exec vt-db pg_isready -U postgres >/dev/null 2>&1; then
              echo "PostGIS pret apres ~$((i*2))s"; break
            fi
            sleep 2
          done

      - name: Smoke test — demarrer backend + AI + frontend
        run: |
          # Backend (port expose pour l'attente)
          docker run -d --network vt-smoke -p 8082:8082 --name vt-backend \
            -e DB_HOST=vt-db -e DB_PORT=5432 -e DB_NAME=visit_tunisia \
            -e DB_USER=postgres -e DB_PASSWORD=admin \
            -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
            -e MAIL_USERNAME=${{ secrets.MAIL_USERNAME }} \
            -e MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }} \
            -e WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }} \
            vt-backend:smoke
          # IA
          docker run -d --network vt-smoke --name vt-ai \
            -e GEMINI_API_KEY=cle_factice_pour_smoke \
            -e SPRING_BOOT_URL=http://vt-backend:8082 \
            vt-ai:smoke
          # Frontend (nginx, proxy vers backend + ai) - demarre en dernier
          docker run -d --network vt-smoke -p 4200:80 --name vt-frontend \
            vt-frontend:smoke

      - name: Smoke test — attendre la BDD et le backend
        run: |
          backend_up=""
          for i in $(seq 1 50); do
            if curl -sf http://localhost:8082/api/destinations -o /dev/null; then
              echo "Backend repond apres ~$((i*3))s"; backend_up=1; break
            fi
            sleep 3
          done
          echo "stat backend_up=${backend_up:-false}"
          if [ -z "$backend_up" ]; then
            echo "=== LOGS BACKEND (diagnostic) ==="
            docker logs vt-backend 2>&1 | tail -50 || true
            echo "=== LOGS FRONTEND ==="
            docker logs vt-frontend 2>&1 | tail -30 || true
            echo "=== CONTENEURS ==="
            docker ps -a --format "{{.Names}} {{.Status}}" || true
            exit 1
          fi

      - name: Smoke test — verifier les reponses via le frontend nginx
        run: |
          echo "=== ETAT CONTENEURS ==="
          docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          echo "=== LOGS FRONTEND ==="
          docker logs vt-frontend 2>&1 | tail -20 || echo "(pas de logs)"
          echo "=== TEST FRONTEND DIRECT ==="
          curl -sS -o /dev/null -w "frontend 4200 -> HTTP %{http_code}\n" http://localhost:4200/ || true
          echo "=== TEST BACKEND DIRECT ==="
          curl -sS -o /dev/null -w "backend 8082 -> HTTP %{http_code}\n" http://localhost:8082/api/destinations || true
          echo "=== VERIFICATIONS ==="
          echo "1) Frontend :"
          curl -sf http://localhost:4200/ -o /dev/null && echo "   OK (page HTML)"
          echo "2) Backend destinations (via proxy nginx) :"
          curl -sf http://localhost:4200/api/destinations -o /dev/null && echo "   OK"
          echo "3) Backend events (via proxy nginx) :"
          curl -sf http://localhost:4200/api/events -o /dev/null && echo "   OK"
          echo "4) AI (via proxy nginx) :"
          # Clé Gemini factice -> on tolere une reponse (meme erreur) ; on verifie juste que la route repond
          code=$(curl -s -o /tmp/ai_resp.txt -w "%{http_code}" http://localhost:4200/api/chat -X POST \
            -H "Content-Type: application/json" -d '{"message":"bonjour","history":[]}')
          if [ "$code" != "000" ]; then echo "   OK (route IA joignable, HTTP $code)"; else echo "   ECHEC"; exit 1; fi
          echo "5) Meteo (direct backend) :"
          curl -sf "http://localhost:8082/api/weather/forecast?lat=36.81&lon=10.17" -o /dev/null && echo "   OK"

      - name: Smoke test — nettoyage
        if: always()
        run: |
          docker rm -f vt-frontend vt-ai vt-backend vt-db >/dev/null 2>&1 || true
          docker network rm vt-smoke >/dev/null 2>&1 || true

      # Le push se fait UNIQUEMENT si le smoke test a reussi
      - name: Pusher les images vers Docker Hub
        if: env.PUSH_IMAGES == 'true'
        run: |
          SHA="${{ github.sha }}"
          for SVC in backend frontend ai; do
            docker tag "vt-$SVC:smoke" "yassineshili/visit_tunisia_$SVC:latest"
            docker tag "vt-$SVC:smoke" "yassineshili/visit_tunisia_$SVC:$SHA"
            docker push --all-tags "yassineshili/visit_tunisia_$SVC"
          done
