server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Taille max des uploads (alignee sur le backend : 10MB/fichier)
    client_max_body_size 50M;

    # ---- API IA (chatbot) -> conteneur ai ----
    # Prefixe plus long que /api/ donc prioritaire automatiquement
    # 'resolver' + variable : resolution DNS retardee au runtime pour eviter
    # [emerg] host not found in upstream si 'ai' n'est pas encore demarre.
    location /api/chat {
        resolver 127.0.0.11;
        set $ai_upstream http://ai:8000;
        proxy_pass $ai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;   # reponses Gemini parfois lentes
    }

    # ---- API backend -> conteneur backend ----
    location /api/ {
        resolver 127.0.0.11;
        set $backend_upstream http://backend:8082;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- SPA Angular : fallback vers index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
