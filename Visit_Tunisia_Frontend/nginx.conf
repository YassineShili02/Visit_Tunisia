server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Taille max des uploads (alignee sur le backend : 10MB/fichier)
    client_max_body_size 50M;

    # ---- API IA (chatbot) -> conteneur ai ----
    # Prefixe plus long que /api/ donc prioritaire automatiquement
    location /api/chat {
        proxy_pass http://ai:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;   # reponses Gemini parfois lentes
    }

    # ---- API backend -> conteneur backend ----
    location /api/ {
        proxy_pass http://backend:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- SPA Angular : fallback vers index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
