<div class="min-h-screen bg-gray-50 flex flex-col">
  <!-- Top Bar -->
  <header class="flex items-center justify-between px-8 py-5 border-b border-gray-200 bg-white">
    <div class="flex items-center gap-2">
      <img src="assets/images/tunisia/logo.png" alt="Visit Tunisia" class="h-20 w-auto" />
    </div>

    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-full bg-blue-600 flex items-center justify-center text-white text-xs font-bold">1</div>
        <div class="w-16 h-1 bg-gray-200 rounded-full">
          <div class="h-1 bg-blue-500 rounded-full" style="width: 50%"></div>
        </div>
        <div class="w-7 h-7 rounded-full bg-gray-200 flex items-center justify-center text-gray-500 text-xs font-bold">2</div>
      </div>
    </div>

    <button (click)="onSkip()" class="text-sm text-gray-500 hover:text-gray-700 font-medium">
      {{ 'onboarding.skip' | transloco }}
    </button>
  </header>

  <!-- Content -->
  <div class="flex-1 flex flex-col items-center px-8 py-8 overflow-y-auto">
    <div class="w-full max-w-4xl flex flex-col items-center my-auto">
    <h1 class="text-3xl font-bold text-gray-900 text-center mb-3">
      {{ 'onboarding.title' | transloco }}
    </h1>
    <p class="text-gray-500 text-center mb-10 max-w-lg">
      {{ 'onboarding.subtitle' | transloco }}
    </p>

    <!-- Loading State -->
    <div *ngIf="loading" class="flex items-center gap-3 text-gray-500 mb-8">
      <svg class="animate-spin h-5 w-5 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
      <span>{{ 'onboarding.loadingCategories' | transloco }}</span>
    </div>

    <!-- Error Banner -->
    <div *ngIf="error && !loading" class="mb-4 px-4 py-2 rounded-lg text-sm bg-amber-50 text-amber-700 border border-amber-200 flex items-center gap-2">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      {{ 'onboarding.errorCategories' | transloco }}
    </div>

    <!-- 2x3 Grid -->
    <div *ngIf="!loading" class="grid grid-cols-3 gap-5 max-w-4xl w-full mb-8">
      <button *ngFor="let cat of categories"
              (click)="toggle(cat.key)"
              class="relative h-52 rounded-2xl overflow-hidden text-start group transition-all"
              [class.ring-4]="isSelected(cat.key)"
              [class.ring-blue-500]="isSelected(cat.key)"
              [class.ring-offset-2]="isSelected(cat.key)"
              [class.hover:shadow-lg]="!isSelected(cat.key)">
        <!-- Photo -->
        <img [src]="cat.photo" [alt]="categoryLabel(cat.key)" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
        <!-- Gradient -->
        <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent"></div>

        <!-- Icon Pill -->
        <div class="absolute top-3 start-3 w-9 h-9 rounded-full flex items-center justify-center bg-white/20 backdrop-blur-sm">
          <span [innerHTML]="getIcon(cat.icon)"></span>
        </div>

        <!-- Check Badge -->
        <div *ngIf="isSelected(cat.key)" class="absolute top-3 end-3 w-7 h-7 rounded-full flex items-center justify-center" [style.background]="cat.color">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>

        <!-- Text -->
        <div class="absolute bottom-0 inset-x-0 p-4">
          <p class="text-white font-bold text-lg">{{ categoryLabel(cat.key) }}</p>
          <p class="text-white/70 text-sm">{{ 'onboarding.catDesc.' + cat.key | transloco }}</p>
        </div>
      </button>
    </div>

    <!-- Selection Count -->
    <p *ngIf="!loading" class="text-sm text-gray-500 mb-6">{{ 'onboarding.selectedText' | transloco: { n: selectionCount } }}</p>

    <!-- Continue Button -->
    <button *ngIf="!loading"
            (click)="onContinue()"
            [disabled]="!canContinue"
            class="px-8 py-3 rounded-xl font-semibold text-white transition-colors"
            [class]="canContinue ? 'bg-blue-600 hover:bg-blue-700 cursor-pointer' : 'bg-gray-300 cursor-not-allowed'">
      {{ 'onboarding.continue' | transloco }}
    </button>
  </div>
</div>
</div>
