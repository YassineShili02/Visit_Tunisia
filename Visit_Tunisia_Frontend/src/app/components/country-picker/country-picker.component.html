<div class="relative w-full">
  <!-- Input box showing selected flag + country name -->
  <button type="button"
          (click)="toggleDropdown($event)"
          class="w-full px-4 py-3 rounded-xl text-sm flex items-center justify-between outline-none transition-all cursor-pointer bg-white"
          style="border: 1.5px solid rgba(27,111,168,0.18); color: #2C2C2C;">
    <div class="flex items-center gap-2.5 overflow-hidden">
      <img [src]="flagUrl(currentCountry.code)"
           [alt]="currentCountry.name"
           class="w-5 h-3.5 object-cover rounded-sm border border-black/10 shrink-0" />
      <span class="truncate text-sm font-medium">{{ countryLabel(currentCountry) }}</span>
    </div>
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="#6B6B6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
         class="transition-transform duration-200 shrink-0 ms-1"
         [class.rotate-180]="dropdownOpen">
      <path d="m6 9 6 6 6-6"/>
    </svg>
  </button>

  <!-- Searchable Dropdown menu -->
  <div *ngIf="dropdownOpen"
       (click)="$event.stopPropagation()"
       class="absolute inset-x-0 top-full mt-1.5 z-[120] bg-white rounded-xl shadow-xl border border-gray-200 overflow-hidden max-h-60 flex flex-col"
       style="font-family: Inter, sans-serif;">
    <!-- Search Input -->
    <div class="p-2 border-b border-gray-100 bg-gray-50/70 sticky top-0 z-10">
      <div class="relative">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="absolute start-3 top-1/2 -translate-y-1/2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input type="text"
               [(ngModel)]="search"
               [attr.placeholder]="'countryPicker.search' | transloco"
               class="w-full ps-8 pe-3 py-1.5 text-xs rounded-lg border border-gray-200 outline-none focus:border-[#1B6FA8] bg-white" />
      </div>
    </div>

    <!-- Country Options List -->
    <div class="overflow-y-auto flex-1 py-1 divide-y divide-gray-50">
      <button *ngFor="let c of filteredCountries"
              type="button"
              (click)="selectCountry(c, $event)"
              class="w-full px-3.5 py-2.5 text-xs flex items-center justify-between transition-colors text-start font-medium hover:bg-sky-50"
              [style.background-color]="c.name.toLowerCase() === currentCountry.name.toLowerCase() ? 'rgba(27,111,168,0.12)' : 'transparent'"
              [style.color]="c.name.toLowerCase() === currentCountry.name.toLowerCase() ? '#1B6FA8' : '#1F2937'">
        <div class="flex items-center gap-2.5 min-w-0">
          <img [src]="flagUrl(c.code)" [alt]="c.name" class="w-5 h-3.5 object-cover rounded-sm border border-black/10 shrink-0" />
          <span class="truncate">{{ countryLabel(c) }}</span>
        </div>
        <span class="text-[10px] text-gray-400 font-mono shrink-0 ms-2">{{ c.code }}</span>
      </button>

      <div *ngIf="filteredCountries.length === 0" class="px-4 py-3 text-xs text-gray-400 text-center italic">
        {{ 'countryPicker.noResults' | transloco }}
      </div>
    </div>
  </div>
</div>
