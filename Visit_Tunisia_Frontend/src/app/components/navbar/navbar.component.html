<nav class="fixed top-0 inset-x-0 z-50 flex items-center justify-between px-10" style="height: 68px; background: rgba(252, 248, 240, 0.92); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.06);">

  <!-- Logo -->
  <div class="flex items-center gap-2.5 cursor-pointer" (click)="navigate.emit('home')">
    <img src="assets/images/tunisia/logo.png" alt="Visit Tunisia" class="h-20 w-auto" />
  </div>

  <!-- Center Nav Links -->
  <div class="flex items-center gap-1">
    <button
      *ngFor="let key of navLinkKeys"
      (click)="onNavClick(key)"
      class="relative px-4 py-2 text-sm font-medium font-inter transition-colors"
      [style.color]="activeLinkKey === key ? '#D97D45' : '#4A5568'"
    >
      {{ key | transloco }}
      <span
        *ngIf="activeLinkKey === key"
        class="absolute bottom-0 start-1/2 -translate-x-1/2 w-1.5 h-1.5 rounded-full"
        style="background: #D97D45;"
      ></span>
    </button>
  </div>

  <!-- Right Side -->
  <div class="flex items-center gap-3">

    <!-- Mes conversations (logged in tourist only) -->
    <button *ngIf="user && isTourist"
            (click)="openConversations.emit()"
            class="flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium font-inter transition-colors hover:bg-gray-100"
            style="color: #4A5568;" [title]="'nav.myConversationsTitle' | transloco">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span class="hidden lg:inline">{{ 'nav.myConversations' | transloco }}</span>
    </button>

    <!-- Mes Favoris (logged in tourist only) -->
    <button *ngIf="user && isTourist"
            (click)="favoritesClick.emit()"
            class="flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium font-inter transition-colors hover:bg-gray-100"
            style="color: #4A5568;" [title]="'nav.myFavorites' | transloco">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
      <span class="hidden lg:inline">{{ 'nav.myFavorites' | transloco }}</span>
    </button>

    <!-- Mes Itinéraires (logged in tourist only) -->
    <button *ngIf="user && isTourist"
            (click)="navigate.emit('my-itineraries')"
            class="flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium font-inter transition-colors hover:bg-gray-100"
            style="color: #4A5568;" [title]="'nav.myItineraries' | transloco">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
      </svg>
      <span class="hidden lg:inline">{{ 'nav.myItineraries' | transloco }}</span>
    </button>

    <!-- Divider -->
    <div *ngIf="user && isTourist" class="w-px h-5 bg-gray-200"></div>

    <!-- Search Button -->
    <button (click)="searchClick.emit()" class="p-2 rounded-lg transition-colors hover:bg-gray-100" [title]="'nav.search' | transloco">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A5568" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </button>

    <!-- Language Dropdown -->
    <div class="relative">
      <button (click)="toggleLang()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium font-inter transition-colors hover:bg-gray-100" style="color: #4A5568;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        {{ currentLangShort }}
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
      <div *ngIf="langOpen" class="absolute end-0 top-full mt-1 w-40 bg-white rounded-xl shadow-lg border border-gray-100 py-1 z-50">
        <button
          *ngFor="let lang of langOptions"
          (click)="selectLang(lang.code)"
          class="w-full text-start px-4 py-2 text-sm font-inter transition-colors hover:bg-gray-50 flex items-center justify-between"
          [style.color]="activeLang === lang.code ? '#D97D45' : '#4A5568'"
          [style.font-weight]="activeLang === lang.code ? '600' : '400'"
        >
          <span>{{ lang.labelKey | transloco }}</span>
          <span *ngIf="lang.isRtl" class="text-[10px] text-gray-400">RTL</span>
        </button>
      </div>
    </div>

    <!-- Logged Out: Se connecter Button -->
    <button
      *ngIf="!user"
      (click)="authClick.emit()"
      class="flex items-center gap-1.5 px-5 py-2 rounded-xl text-sm font-semibold text-white font-inter transition-all hover:shadow-lg"
      style="background: #1B6FA8;"
    >
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      {{ 'nav.login' | transloco }}
    </button>

    <!-- Logged In: Profile Dropdown -->
    <div *ngIf="user" class="relative">
      <button (click)="toggleProfile()" class="flex items-center gap-2 ps-1 pe-3 py-1 rounded-xl transition-colors hover:bg-gray-100">
        <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold text-white font-poppins" style="background: #1B6FA8;">
          {{userInitials}}
        </div>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#4A5568" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>

      <!-- Profile Dropdown Menu -->
      <div *ngIf="profileOpen" class="absolute end-0 top-full mt-2 w-64 bg-white rounded-xl shadow-xl border border-gray-100 py-2 z-50">
        <!-- User Info -->
        <div class="px-4 py-3 border-b border-gray-100">
          <p class="text-sm font-semibold text-[#2D3748] font-inter">{{userName}}</p>
          <p class="text-xs text-gray-500 font-inter mt-0.5">{{user.email}}</p>
          <span *ngIf="isAdmin" class="inline-flex items-center gap-1 mt-2 px-2 py-0.5 rounded-md text-[10px] font-semibold text-white" style="background: #D97D45;">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            {{ 'nav.adminBadge' | transloco }}
          </span>
        </div>

        <!-- Menu Items -->
        <button (click)="accountClick.emit(); closeProfile()" class="w-full text-start px-4 py-2.5 text-sm font-inter text-[#4A5568] hover:bg-gray-50 flex items-center gap-2.5 transition-colors">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          {{ 'nav.profile' | transloco }}
        </button>

        <button *ngIf="isAdmin" (click)="adminClick.emit(); closeProfile()" class="w-full text-start px-4 py-2.5 text-sm font-inter text-[#4A5568] hover:bg-gray-50 flex items-center gap-2.5 transition-colors">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          {{ 'nav.administration' | transloco }}
        </button>

        <div class="border-t border-gray-100 my-1"></div>

        <button (click)="logout.emit(); closeProfile()" class="w-full text-start px-4 py-2.5 text-sm font-inter text-red-500 hover:bg-red-50 flex items-center gap-2.5 transition-colors">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          {{ 'nav.logout' | transloco }}
        </button>
      </div>
    </div>
  </div>

  <!-- Click Outside to Close -->
  <div *ngIf="langOpen || profileOpen" class="fixed inset-0 z-40" (click)="langOpen = false; closeProfile()"></div>
</nav>
