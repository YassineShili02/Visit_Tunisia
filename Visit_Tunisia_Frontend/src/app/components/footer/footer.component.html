<footer class="w-full px-16 py-10 mt-4" style="background: #1B6FA8; border-top: 1px solid rgba(255,255,255,0.1);">
  <div class="max-w-[1440px] mx-auto flex items-center justify-between gap-4 flex-wrap">
    <div class="flex items-center gap-2.5">
      <img src="assets/images/tunisia/logo.png" alt="Visit Tunisia" class="h-20 w-auto" />
    </div>
    <p class="text-xs font-inter" style="color: rgba(255,255,255,0.55);">{{ 'footer.tagline' | transloco }}</p>
    <div class="flex items-center gap-5">
      <button class="text-xs font-inter transition-opacity hover:opacity-100 opacity-60" style="color: #fff;">{{ 'footer.legal' | transloco }}</button>
      <button class="text-xs font-inter transition-opacity hover:opacity-100 opacity-60" style="color: #fff;">{{ 'footer.privacy' | transloco }}</button>
      <button class="text-xs font-inter transition-opacity hover:opacity-100 opacity-60" style="color: #fff;">{{ 'footer.contact' | transloco }}</button>
    </div>
  </div>
</footer>
