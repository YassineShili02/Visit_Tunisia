<div class="relative w-full">
  <svg viewBox="0 0 480 500" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg">

    <!-- Sea Background -->
    <rect x="0" y="0" width="480" height="500" rx="16" fill="#E8F4F8"/>

    <!-- Tunisia Land Path -->
    <path [attr.d]="tunisiaPath" fill="#F5EDE0" stroke="#D4C5A9" stroke-width="1.5"/>

    <!-- Governorate Labels -->
    <g *ngFor="let gov of governorateLabels" class="pointer-events-none">
      <text
        [attr.x]="gov.x"
        [attr.y]="gov.y"
        text-anchor="middle"
        font-size="11"
        font-weight="600"
        fill="#6B7280"
        opacity="0.7"
        font-family="Inter, sans-serif"
      >
        {{ regionLabel(gov.name) }}
      </text>
    </g>

    <!-- Destination Markers -->
    <g *ngFor="let d of destinations"
       (mouseenter)="hover.emit(d.id)"
       (mouseleave)="hover.emit(null)"
       class="cursor-pointer">

      <!-- Pulse ring for hovered -->
      <circle *ngIf="hoveredId === d.id"
              [attr.cx]="d.mapX" [attr.cy]="d.mapY"
              r="14" [attr.fill]="getColor(d.category)" fill-opacity="0.15">
        <animate attributeName="r" values="8;16;8" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="fill-opacity" values="0.25;0.05;0.25" dur="1.5s" repeatCount="indefinite"/>
      </circle>

      <!-- Marker dot -->
      <circle [attr.cx]="d.mapX" [attr.cy]="d.mapY"
              [attr.r]="hoveredId === d.id ? 6 : 4.5"
              [attr.fill]="getColor(d.category)"
              stroke="white" stroke-width="1.5"
              style="transition: r 0.2s ease;"/>

      <!-- Tooltip -->
      <g *ngIf="hoveredId === d.id">
        <rect [attr.x]="d.mapX - getTooltipWidth(d.name) / 2"
              [attr.y]="d.mapY - 36"
              [attr.width]="getTooltipWidth(d.name)"
              height="24" rx="6"
              fill="white" filter="url(#tooltipShadow)"/>
        <text [attr.x]="d.mapX" [attr.y]="d.mapY - 20"
              text-anchor="middle" font-size="10" font-weight="600" fill="#2D3748" font-family="Inter, sans-serif">
          {{d.name}}
        </text>
      </g>
    </g>

    <!-- Shadow filter -->
    <defs>
      <filter id="tooltipShadow" x="-10%" y="-10%" width="120%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
      </filter>
    </defs>
  </svg>

  <!-- Category Legend (bottom-left) -->
  <div class="absolute bottom-4 start-4 bg-white/90 backdrop-blur-sm rounded-xl px-4 py-3 shadow-sm border border-gray-100">
    <div class="flex flex-col gap-1.5">
      <div *ngFor="let entry of categoryEntries" class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full" [style.background]="entry[1]"></span>
        <span class="text-[10px] font-medium text-gray-600 font-inter">{{entry[0]}}</span>
      </div>
    </div>
  </div>
</div>
